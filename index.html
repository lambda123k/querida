<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Querida</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Querida">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF5EF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
<link rel="apple-touch-icon" href="icon.png">
<link id="manifest" rel="manifest" href="manifest.json">
<style>
/* Layout : appli iOS — grands titres, listes groupées, fiches qui montent, barre d'onglets. Palette Azulejo. */
:root{
  /* Identité Querida — orange sanguine, règle 60/30/10
     60 % fond « zeste » crème + cartes blanches · 30 % pêche douce et brun encre · 10 % sanguine (actions, chiffres clés, cachet).
     Signature : le cachet de cire sanguine à l'initiale de Romane, et les titres en serif italique comme une lettre. */
  --bg:#FBF5EF; --card:#FFFFFF; --label:#3B1F17; --label2:#7A5A4C; --label3:rgba(90,50,35,.38);
  --sep:rgba(90,50,35,.12); --fill:rgba(204,63,39,.07); --fill2:rgba(204,63,39,.14);
  --accent:#CC3F27; --on-accent:#FFFFFF; --deep:#9E3320; --rind:#F2873B; --soft:#FBE3D3;
  --blue:#F2873B; --peach:#FBE3D3; --peach2:#F6C9AE; --danger:#B8341F;
  --sun:#F2873B; --red:#9E3320; --saff-soft:#FBE3D3;
  --ease:cubic-bezier(.2,.8,.2,1); --dur:.35s;
  --bar:rgba(251,245,239,.86);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --f-letter:ui-serif,"New York",Georgia,"Times New Roman",serif;
  --f-display:"Instrument Serif",ui-serif,"New York",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17100D; --card:#241915; --label:#FBEFE8; --label2:#C9AFA3; --label3:rgba(251,239,232,.36);
  --sep:rgba(255,255,255,.12); --fill:rgba(255,106,77,.10); --fill2:rgba(255,106,77,.17);
  --accent:#FF6A4D; --on-accent:#1A0B06; --deep:#E0573D; --rind:#F59A55; --soft:#3A211A;
  --blue:#F59A55; --peach:#3A211A; --peach2:#55302A; --danger:#FF6A4D;
  --sun:#F59A55; --red:#E0573D; --saff-soft:#3A211A;
  --bar:rgba(23,16,13,.86); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17100D; --card:#241915; --label:#FBEFE8; --label2:#C9AFA3; --label3:rgba(251,239,232,.36);
  --sep:rgba(255,255,255,.12); --fill:rgba(255,106,77,.10); --fill2:rgba(255,106,77,.17);
  --accent:#FF6A4D; --on-accent:#1A0B06; --deep:#E0573D; --rind:#F59A55; --soft:#3A211A;
  --blue:#F59A55; --peach:#3A211A; --peach2:#55302A; --danger:#FF6A4D;
  --sun:#F59A55; --red:#E0573D; --saff-soft:#3A211A;
  --bar:rgba(23,16,13,.86); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--label);font-family:var(--f);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
p{margin:0}
[hidden]{display:none!important}

.screen{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:8px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
.eyebrow{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--label2)}
.ltitle{font-family:var(--f-display);font-style:italic;font-size:42px;font-weight:400;letter-spacing:-.01em;line-height:1.02;margin:0;text-wrap:balance}
.head{display:flex;flex-direction:column;gap:2px;padding-top:12px}
.headrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.sub{color:var(--label2);font-size:15px}
.foot{color:var(--label2);font-size:13px;padding-inline:16px}

/* Groupes iOS */
.ghead{font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--label2);padding:0 16px 6px}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.rowi{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:48px;width:100%;text-align:left;position:relative}
.rowi + .rowi::before{content:"";position:absolute;top:0;left:56px;right:0;height:1px;background:var(--sep);transform:scaleY(.5)}
.group.plain .rowi + .rowi::before{left:16px}
.rowi .t{flex:1;min-width:0}
.rowi .t b{font-weight:400;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowi .t small{display:block;color:var(--label2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowi .v{color:var(--label2);font-size:17px;display:flex;align-items:center;gap:6px}
.chev{width:8px;height:13px;color:var(--label3);flex:none}
.sq{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff}
.sq svg{width:18px;height:18px}
.sq.photo{background:#CC3F27}.sq.video{background:#9E3320}.sq.audio{background:#E0703A}.sq.text{background:#7A5A4C}.sq.song{background:#B5502E}
.check{color:var(--accent);width:20px;height:20px}

/* Boutons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:17px;width:100%}
.btn.tinted{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.btn.gray{background:var(--fill);color:var(--label)}
.btn svg{width:20px;height:20px}
.btn:disabled{opacity:.45}
.tbtn{color:var(--accent);font-size:17px;padding:8px 0;min-height:44px}
.tbtn.bold{font-weight:600}
.tbtn:disabled{color:var(--label3)}
.danger{color:var(--danger)}
.pillbtn{display:inline-flex;align-items:center;gap:6px;background:var(--fill);border-radius:999px;padding:7px 14px;font-size:15px;font-weight:600;color:var(--accent)}
.pillbtn svg{width:16px;height:16px}

/* Champs */
.field{width:100%;border:0;background:transparent;padding:12px 16px;font-size:17px;outline:none}
textarea.field{min-height:130px;resize:none;line-height:1.4}
.field::placeholder{color:var(--label3)}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;padding:7px 4px;border-radius:7px;font-size:14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--fill2);transition:background .2s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked + span{background:#34C759}
.switch input:checked + span::after{transform:translateX(20px)}
.err{color:var(--danger);font-size:14px;padding-inline:16px}

/* Carte héro */
.hero{background:var(--card);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.hero h2{font-family:var(--f-display);font-size:28px;font-weight:400;margin:0;letter-spacing:-.01em;text-wrap:balance}
.envelope{position:relative;width:180px;aspect-ratio:1.5;border-radius:12px;background:var(--peach);overflow:hidden}
.envelope .flap{position:absolute;inset:0 0 42% 0;background:var(--peach2);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.envelope .seal{position:absolute;left:50%;top:58%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-style:italic;font-size:24px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.18),0 2px 6px rgba(120,30,15,.35);transition:opacity .25s}
.envelope.open .flap{transform:rotateX(180deg)}
.envelope.open .seal{opacity:0}
.hero.sun{background:var(--accent);color:var(--on-accent)}
.hero.sun .sub,.hero.sun .eyebrow{color:rgba(255,255,255,.88)}
.hero.sun .big-num{color:#fff}
.hero.sun .btn{background:#fff;color:var(--accent)}
.hero.sun .envelope{background:var(--soft)}
.hero.sun .envelope .flap{background:var(--peach2)}
.hero.sun .envelope .seal{background:var(--deep);color:#fff}
.hero.saff{background:var(--soft)}
.hero.saff .big-num{color:var(--accent)}
.hero.saff .chips span{background:var(--card)}
.big-num{font-family:var(--f-display);font-size:64px;font-weight:400;letter-spacing:-.01em;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.progress{height:6px;border-radius:999px;background:var(--fill);overflow:hidden;width:100%}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--rind),var(--accent));border-radius:999px}

/* Notification */
.notif{background:var(--card);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.notif .sq{background:var(--accent)}
.notif .t{flex:1;display:flex;flex-direction:column;gap:6px}
.notif b{font-weight:600}
.notif p{font-size:14px;color:var(--label2)}

/* Barre d'onglets */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar .in{display:flex;width:100%;max-width:520px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--label3);padding:4px 0}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--accent)}

/* Fiches */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.32);animation:fade .25s ease both}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:41;background:var(--bg);border-radius:12px 12px 0 0;display:flex;flex-direction:column;animation:up .35s var(--ease) both;max-width:640px;margin:0 auto}
.sheet.full{top:0;border-radius:0;max-width:none}
.navbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 16px;min-height:52px;border-bottom:.5px solid var(--sep)}
.navbar .ttl{font-weight:600;font-size:17px;text-align:center;white-space:nowrap}
.navbar .r{justify-self:end}
.navbar .l{justify-self:start}
.sbody{flex:1;overflow-y:auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px;-webkit-overflow-scrolling:touch}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--fill2);margin:6px auto 0}
.asheet{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:41;display:flex;flex-direction:column;gap:8px;animation:up .3s var(--ease) both;max-width:520px;margin:0 auto}
.asheet .group{border-radius:14px}
.asheet .rowi{justify-content:flex-start;min-height:56px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Média */
.media{border-radius:12px;overflow:hidden;background:#000}
.media img,.media video{display:block;width:100%;max-height:62vh;object-fit:contain}
audio{width:100%}
.letter{font-family:var(--f-letter);font-size:20px;line-height:1.5;white-space:pre-wrap}
.from{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--accent)}
.song{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:12px;padding:10px;width:100%;text-align:left}
.song img,.song .art{width:52px;height:52px;border-radius:8px;object-fit:cover;flex:none;background:var(--fill);display:grid;place-items:center;color:var(--label3)}
.song .t{min-width:0;flex:1}
.song .t b,.song .t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .t b{font-weight:600}
.song .t span{color:var(--label2);font-size:14px}
.rec{display:flex;flex-direction:column;gap:12px;align-items:center}
.rec video{width:100%;border-radius:12px;background:#000;max-height:50vh}
.recdot{width:12px;height:12px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.mono{font-variant-numeric:tabular-nums;font-weight:600}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.thumbs .th{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;background:var(--fill)}
.thumbs .th img{width:100%;height:100%;object-fit:cover}
.thumbs .th button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.thumbs .th button svg{width:12px;height:12px}
.thumbs .add{display:grid;place-items:center;color:var(--accent);background:var(--card)}
.thumbs .add svg{width:28px;height:28px}
.scroller{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding-inline:16px}
.scroller img{flex:none;width:86%;max-height:60vh;object-fit:cover;border-radius:12px;scroll-snap-align:center}

/* Calendrier */
.cal{background:var(--card);border-radius:16px;padding:14px 12px}
.calhead{display:flex;justify-content:space-between;align-items:center;padding:0 4px 10px}
.calhead b{font-size:17px;font-weight:600;text-transform:capitalize}
.calhead button{width:36px;height:36px;display:grid;place-items:center;color:var(--accent);border-radius:50%}
.calhead button:disabled{color:var(--label3)}
.calhead svg{width:10px;height:16px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;font-size:11px;font-weight:600;color:var(--label3);padding-bottom:4px}
.day{aspect-ratio:.8;border-radius:9px;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-size:13px;font-weight:500;color:var(--label2);background:transparent}
.day.has{background:var(--fill);color:var(--label)}
.day img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.day.has.img span{position:relative;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);font-weight:700}
.day .dots{position:absolute;top:5px;left:0;right:0;display:flex;justify-content:center;gap:3px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.day .dots i.j{background:var(--rind)}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day.out{visibility:hidden}
.legend{display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--label2);padding-top:10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px}
.legend i.j{background:var(--rind)}

/* Carnet */
.entry{background:var(--card);border-radius:16px;overflow:hidden;width:100%;text-align:left;display:flex;flex-direction:column}
.entry .cover{aspect-ratio:16/10;background:var(--peach);position:relative;overflow:hidden}
.entry .cover img{width:100%;height:100%;object-fit:cover;display:block}
.entry .cover .play{position:absolute;inset:0;display:grid;place-items:center}
.entry .cover .play span{width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.entry .cover .play svg{width:24px;height:24px;margin-left:3px}
.entry .meta{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.entry .meta b{font-size:17px;font-weight:600}
.entry .meta p{color:var(--label2);font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--label2)}
.tag.on{color:var(--accent)}
.tag svg{width:13px;height:13px}
.empty{text-align:center;color:var(--label2);padding:36px 24px;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty svg{width:44px;height:44px;color:var(--label3)}
.empty b{color:var(--label);font-size:20px;font-weight:600}

/* Montage */
.player{position:fixed;inset:0;z-index:60;background:#000;color:#fff;display:flex;flex-direction:column}
.player .bars{display:flex;gap:3px;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0}
.player .bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.player .bars i b{display:block;height:100%;width:0;background:#fff}
.player .top{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:14px;font-weight:600}
.player .top button{color:#fff;width:36px;height:36px;display:grid;place-items:center}
.player .top svg{width:22px;height:22px}
.player .stage{flex:1;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;animation:fade .5s ease both}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 6s ease-out both}
.slide .cap{position:absolute;left:16px;right:16px;bottom:calc(24px + env(safe-area-inset-bottom,0px));font-size:15px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.slide.txt{background:#CC3F27;padding:32px}
.slide.txt.b{background:#FBE3D3;color:#3B1F17}
.slide.txt.r{background:#9E3320}
.slide.txt p{font-family:var(--f-display);font-style:italic;font-size:32px;line-height:1.35;text-align:center;text-wrap:balance}
.slide.txt small{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.slide.end{background:#FBF5EF;color:#3B1F17;flex-direction:column;gap:10px;text-align:center;padding:32px}
.slide.end b{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:38px}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
.player .tapl,.player .tapr{position:absolute;top:0;bottom:0;width:35%;z-index:2}
.player .tapl{left:0}.player .tapr{right:0}
.nowplaying{position:relative;z-index:3;display:flex;align-items:center;gap:6px;font-size:13px;opacity:.9;padding:0 14px 8px}
.nowplaying svg{width:14px;height:14px}

/* Démo */
.demo{position:sticky;top:env(safe-area-inset-top,0px);z-index:35;background:var(--label);color:var(--bg);font-size:12px;padding:6px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.demo button{color:var(--bg);border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);border-radius:999px;padding:3px 10px;font-size:12px}
.demo button[aria-pressed="true"]{background:var(--bg);color:var(--label)}

.topbar{display:flex;justify-content:flex-end;padding-top:8px;margin-bottom:-14px}
.helpbtn{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 12px 6px 6px;font-size:14px;font-weight:600;color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.helpbtn i{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px}
.steps .rowi{align-items:flex-start;padding-block:14px}
.steps .rowi .t b{white-space:normal;font-weight:600}
.steps .rowi .t small{white-space:normal;font-size:15px;line-height:1.4;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chips span{background:var(--fill);border-radius:999px;padding:5px 11px;font-size:14px}
.logo{width:64px;height:64px;border-radius:15px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.10)}
.logo svg{width:100%;height:100%;display:block}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.reveal{animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

function extFor(type = ""){
  if (type.includes("jpeg")) return "jpg"; if (type.includes("png")) return "png"; if (type.includes("webp")) return "webp";
  if (type.includes("quicktime")) return "mov"; if (type.includes("mp4")) return type.startsWith("audio") ? "m4a" : "mp4";
  if (type.includes("webm")) return "webm"; if (type.includes("mpeg")) return "mp3"; if (type.includes("ogg")) return "ogg";
  return "bin";
}

/* ---------------- Planning des ouvertures ---------------- */
function phased(n, W){
  const gaps = n - 1, deficit = (W - 1) - gaps;
  let k4 = Math.floor(deficit / 2 / 3), k2 = deficit - 3 * k4;
  while (k2 + k4 > gaps && k2 >= 3){ k2 -= 3; k4 += 1; }
  if (k2 + k4 > gaps) return null;
  const g = [...Array(gaps - k2 - k4).fill(1), ...Array(k2).fill(2), ...Array(k4).fill(4)];
  const w = [1]; g.forEach(x => w.push(w[w.length - 1] + x)); return w;
}
function schedule(n){
  const start = parseDay(CONFIG.DEPART), end = parseDay(CONFIG.RETOUR);
  const W = Math.max(1, Math.floor((end - start) / DAY / 7));
  if (n <= 0) return [];
  let weeks = [];
  if (n >= W){ for (let k = 1; k <= n; k++) weeks.push(Math.ceil(k * W / n)); }
  else if (n === 1) weeks = [1];
  else if (phased(n, W)) weeks = phased(n, W);
  else { const p = Math.log(W) / Math.log(n); let prev = 0; for (let k = 1; k <= n; k++){ let w = Math.round(W * Math.pow(k / n, p)); w = Math.max(prev + 1, w); w = Math.min(w, W - (n - k)); weeks.push(w); prev = w; } }
  const s0 = new Date(start);
  return weeks.map(w => new Date(s0.getFullYear(), s0.getMonth(), s0.getDate() + 7 * (w - 1)).getTime());
}
function hash(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function state(){
  const all = Store.caps, t = now();
  const regular = all.filter(c => (c.moment || "voyage") === "voyage").sort((a, b) => hash(a.id) - hash(b.id));
  const dates = schedule(regular.length);
  const unlocked = dates.filter(d => d <= t).length;
  const opened = regular.filter(c => c.opened_at).length;
  const start = parseDay(CONFIG.DEPART), end = parseDay(CONFIG.RETOUR);
  const total = Math.round((end - start) / DAY);
  return {
    available: Math.max(0, unlocked - opened),
    next: regular.find(c => !c.opened_at) || null,
    nextDate: dates[unlocked] ?? null,
    waiting: regular.filter(c => !c.opened_at).length,
    cafard: all.filter(c => c.moment === "cafard" && !c.opened_at),
    avant: all.filter(c => c.moment === "avant" && !c.opened_at),
    authors: [...new Map(all.map(c => [c.author_id, c])).values()],
    retour: all.filter(c => c.moment === "retour" && !c.opened_at),
    started: t >= start, back: t >= end,
    dayN: Math.min(total, Math.floor((t - start) / DAY) + 1), total,
    toStart: Math.max(0, Math.ceil((start - t) / DAY)),
    opened: all.filter(c => c.opened_at)
  };
}

/* ===== Romane : souvenirs (calendrier) ===== */
let calMonth = null;
function itemsByDay(){
  const map = {};
  const add = (k, it) => (map[k] = map[k] || []).push(it);
  Store.caps.filter(c => c.opened_at).forEach(c => add(dayKey(new Date(c.opened_at).getTime()), { type:"cap", c, img: capThumb(c) }));
  Store.journal.filter(e => e.kind !== "montage").forEach(e => add(e.date, { type:"entry", e, img: e.photos && e.photos.length ? Store.url(e.photos[0]) : null }));
  return map;
}
function capThumb(c){ if (c.kind === "photo") return Store.url(c.media_path); if (c.kind === "song" && c.song && c.song.artwork) return c.song.artwork; return null; }
function viewSouvenirs(){
  const start = new Date(parseDay(CONFIG.DEPART)), end = new Date(parseDay(CONFIG.RETOUR));
  const minM = new Date(start.getFullYear(), start.getMonth(), 1), maxM = new Date(end.getFullYear(), end.getMonth(), 1);
  if (!calMonth){ const n = new Date(now()); calMonth = new Date(n.getFullYear(), n.getMonth(), 1); if (calMonth < minM) calMonth = minM; if (calMonth > maxM) calMonth = maxM; }
  const map = itemsByDay();
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const first = (new Date(y, m, 1).getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
  const todayK = dayKey(now());
  let cells = "";
  for (let i = 0; i < first; i++) cells += `<div class="day out"></div>`;
  for (let d = 1; d <= days; d++){
    const k = dayKey(new Date(y, m, d).getTime()), its = map[k] || [];
    const img = (its.find(x => x.img) || {}).img;
    const dots = its.length ? `<span class="dots">${its.some(x => x.type === "cap") ? "<i></i>" : ""}${its.some(x => x.type === "entry") ? '<i class="j"></i>' : ""}</span>` : "";
    const cls = `day ${its.length ? "has" : ""} ${img ? "img" : ""} ${k === todayK ? "today" : ""}`;
    cells += its.length ? `<button class="${cls}" data-act="day" data-v="${k}" aria-label="${d} ${fmt(calMonth, { month:"long" })}, ${its.length} souvenir${its.length > 1 ? "s" : ""}">${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : ""}${img ? "" : dots}<span>${d}</span></button>` : `<div class="${cls}"><span>${d}</span></div>`;
  }
  const s = state();
  return `<div class="head"><span class="eyebrow">${s.opened.length} capsule${s.opened.length > 1 ? "s" : ""} ouverte${s.opened.length > 1 ? "s" : ""}</span><h1 class="ltitle">Souvenirs</h1></div>
    <div class="cal"><div class="calhead"><button data-act="cal-prev" aria-label="Mois précédent" ${calMonth <= minM ? "disabled" : ""}>${IC.chevl}</button><b>${fmt(calMonth, { month:"long", year:"numeric" })}</b><button data-act="cal-next" aria-label="Mois suivant" ${calMonth >= maxM ? "disabled" : ""}>${IC.chevr}</button></div>
      <div class="calgrid">${["L","M","M","J","V","S","D"].map(x => `<div class="dow">${x}</div>`).join("")}${cells}</div>
      <div class="legend"><span><i></i>Capsule</span><span><i class="j"></i>Carnet</span></div></div>
    ${s.opened.length ? `<p class="foot">Touche un jour pour revoir ce que tu as ouvert ou écrit.</p>` : `<p class="foot">Chaque capsule que tu ouvres s'ajoute ici, au jour où tu l'as découverte.</p>`}`;
}
function openDay(k){
  const its = itemsByDay()[k] || [];
  if (its.length === 1){ const it = its[0]; return it.type === "cap" ? viewCapsule(it.c) : openEntry(it.e); }
  sheet({ title: fmt(parseDay(k), { weekday:"long", day:"numeric", month:"long" }), right:`<button class="tbtn bold" data-act="close">OK</button>`,
    body:`<div class="group">${its.map(it => it.type === "cap"
      ? `<button class="rowi" data-act="view-cap" data-v="${it.c.id}">${sq(it.c.kind)}<span class="t"><b>${esc(it.c.author_name)}</b><small>${TYPES[it.c.kind].label}</small></span>${IC.chev}</button>`

let draftEntry = null;

function drawThumbs(){

    + (draftEntry.photos.length < MAX_PHOTOS ? `<label class="th add" for="e-pick" aria-label="Ajouter des photos">${IC.plus}</label>` : "");

async function saveEntry(){
  const d = draftEntry; if (d.busy) return;
  d.text = document.getElementById("e-text").value.trim(); d.place = document.getElementById("e-place").value.trim(); d.shared = document.getElementById("e-share").checked;

  try{
    const e = { id: uid(), kind:"page", date: d.date, text: d.text || null, place: d.place || null, shared: d.shared };

function openEntry(e){

function shareControls(e){
  return `<div class="group plain"><label class="rowi"><span class="sq" style="background:#B5502E">${IC.people}</span><span class="t"><b>Partager avec la bande</b></span><span class="switch"><input type="checkbox" data-act="toggle-share" data-v="${e.id}" ${e.shared ? "checked" : ""}><span></span></span></label></div>

/* ===== Montage automatique ===== */
function montageItems(cfg){
  const from = cfg.from ? parseDay(cfg.from) : 0, to = cfg.to ? parseDay(cfg.to) + DAY : Infinity;
  const inR = t => t >= from && t < to;
  const out = [];
  Store.caps.filter(c => c.opened_at && inR(new Date(c.opened_at).getTime())).forEach(c => {
    const t = new Date(c.opened_at).getTime();
    if (c.kind === "photo" && Store.url(c.media_path)) out.push({ t, img: Store.url(c.media_path), cap: `De ${c.author_name}` });
    else if (c.text) out.push({ t, text: c.text, cap: c.author_name });
  });
  Store.journal.filter(e => e.kind !== "montage" && inR(parseDay(e.date))).forEach(e => {
    const t = parseDay(e.date);
    (e.photos || []).forEach(p => { const u = Store.url(p); if (u) out.push({ t, img:u, cap: e.place || fmtDate(t) }); });
    if (e.text && !(e.photos || []).length) out.push({ t, text: e.text.slice(0, 220), cap: e.place || "Mon carnet", own:true });
  });
  return out.sort((a, b) => a.t - b.t).slice(0, 40);
}
function friendSongs(){
  const seen = new Set();
  return Store.caps.filter(c => c.kind === "song" && c.song && c.opened_at).sort((a, b) => b.opened_at.localeCompare(a.opened_at))

function pickMime(video){

async function startRec(video){

    layers[layers.length - 1].querySelector(".navbar").innerHTML = `<div></div><div class="ttl">Déposée</div><div class="r"><button class="tbtn bold" data-act="close-render">OK</button></div>`;
    layers[layers.length - 1].querySelector(".sbody").innerHTML = `<div class="center reveal" style="padding-top:12vh;gap:16px"><div class="envelope open"><div class="flap"></div><div class="seal">${INI}</div></div><h2 style="margin:0;font-size:24px">Capsule déposée</h2>
      <p class="sub" style="max-width:30ch">${P()} la découvrira ${d.moment === "retour" ? "à son retour" : d.moment === "cafard" ? "un jour où elle aura besoin d'un sourire" : d.moment === "avant" ? "avant son départ" : "pendant son voyage"}.</p>
      <button class="btn tinted" data-act="again" style="max-width:320px">En déposer une autre</button></div>`;
  }catch(err){ d.busy = false; if (b){ b.disabled = false; b.textContent = "Déposer"; } setErr("L'envoi a échoué. Vérifie ta connexion et réessaie."); }
}
function myCapsuleSheet(c){
  sheet({ title: TYPES[c.kind].label, right:`<button class="tbtn bold" data-act="close">OK</button>`, body:`<div class="group"><div class="rowi">${sq(c.kind)}<span class="t"><b>${esc(summary(c))}</b><small>${esc(MOMENTS[c.moment || "voyage"].label)}</small></span></div></div>
    <p class="foot">${c.opened_at ? `${P()} l'a ouverte le ${fmtDate(new Date(c.opened_at).getTime())}.` : `${P()} ne l'a pas encore ouverte.`}</p>
    <div class="group plain" id="del-zone"><button class="rowi danger" data-act="del-cap-ask" data-v="${c.id}" style="justify-content:center">Supprimer la capsule</button></div>` });
}

/* ===== QR codes (?qr=CODE) ===== */
async function renderQR(){
  const base = location.origin + location.pathname, linkR = base + "?pour=" + encodeURIComponent(CONFIG.CODE_ROMANE);
  $app.innerHTML = `<main class="screen"><div class="head"><h1 class="ltitle">QR codes</h1></div>
    <div><div class="ghead">Pour ${P()}</div><div class="group qr" style="padding:16px"><div id="qr-r"></div><p class="code">${esc(linkR)}</p></div></div>
    <div><div class="ghead">Pour les amis</div><div class="group qr" style="padding:16px"><div id="qr-a"></div><p class="code">${esc(base)}</p></div></div></main>`;
  try{
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js");
    const draw = (id, t) => { const q = qrcode(0, "M"); q.addData(t); q.make(); document.getElementById(id).innerHTML = q.createImgTag(8, 8, "QR code"); };
    draw("qr-r", linkR); draw("qr-a", base);
  }catch(e){ document.getElementById("qr-r").textContent = "Impossible de générer le QR code ici."; }
}

/* ---------------- Actions ---------------- */
document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act, v = b.dataset.v;
  switch (a){
    case "close": popLayer(); break;
    case "close-render": clearLayers(); render(); break;
    case "close-compose": if (rec) stopRec(); draft = null; popLayer(); break;
    case "tab": tab = v; clearLayers(); render(); window.scrollTo(0, 0); break;
    case "ob-rel": obRel = v; drawRelations(); document.getElementById("ob-err").hidden = true; break;
    case "ob-reclaim": { const c = Store.caps.find(x => x.author_id === v); me = { id:v, name:c.author_name, relation:c.relation }; ls.set("hp_me", me); render(); break; }
    case "new-capsule": chooseType(); break;
    case "compose": popLayer(); composeSheet(v); break;
    case "again": clearLayers(); render(); chooseType(); break;
    case "moment": draft.moment = v; drawMoments(); break;
    case "media-reset": draft.blob = null; drawMedia(); break;
    case "rec-start": startRec(v === "video"); break;
    case "rec-stop": stopRec(); break;
    case "song-pick": draft.song = songRes[+v]; drawMedia(); break;
    case "song-reset": draft.song = null; drawMedia(); break;
    case "song-manual": songManual = true; drawMedia(); break;
    case "song-manual-ok": { const t = document.getElementById("s-title").value.trim(), ar = document.getElementById("s-artist").value.trim(); if (!t) return setErr("Écris au moins le titre."); setErr(""); draft.song = { title:t, artist:ar, artwork:null, preview:null, link:null }; songManual = false; drawMedia(); break; }
    case "send": send(); break;
    case "my-capsule": { const c = Store.caps.find(x => x.id === v); if (c) myCapsuleSheet(c); break; }
    case "del-cap-ask": document.getElementById("del-zone").innerHTML = `<button class="rowi danger" data-act="del-cap" data-v="${v}" style="justify-content:center;font-weight:600">Confirmer la suppression</button><button class="rowi" data-act="close" style="justify-content:center">Garder</button>`; break;
    case "del-cap": { const c = Store.caps.find(x => x.id === v); try{ if (c) await Store.removeCapsule(c); }catch(e){} clearLayers(); render(); break; }
    case "open-next": { const s = state(); if (s.available > 0 && s.next) openCapsule(s.next); break; }
    case "open-avant": { const s = state(); if (s.avant.length) openCapsule(s.avant[0]); break; }
    case "open-cafard": { const s = state(); if (s.cafard.length) openCapsule(s.cafard[Math.floor(Math.random() * s.cafard.length)]); break; }
    case "open-retour": { const s = state(); if (s.retour.length && s.back) openCapsule(s.retour[0]); break; }
    case "view-cap": { const c = Store.caps.find(x => x.id === v); if (c) viewCapsule(c); break; }
    case "cal-prev": calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); render(); break;
    case "cal-next": calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); render(); break;
    case "day": openDay(v); break;
    case "new-entry": newEntrySheet(); break;
    case "e-rm": draftEntry.photos.splice(+v, 1); drawThumbs(); break;
    case "save-entry": saveEntry(); break;
    case "entry": { const e = Store.journal.find(x => x.id === v); if (e) openEntry(e); break; }
    case "del-entry": b.outerHTML = `<button class="rowi danger" data-act="del-entry-yes" data-v="${v}" style="justify-content:center;font-weight:600">Confirmer la suppression</button>`; break;
    case "del-entry-yes": { const e = Store.journal.find(x => x.id === v); try{ if (e) await Store.removeEntry(e); }catch(x){} clearLayers(); render(); break; }
    case "new-montage": newMontageSheet(); break;
    case "m-period": draftM.period = v; drawMontageForm(); break;
    case "m-song": { const list = [...friendSongs(), ...draftM.extra]; draftM.song = +v < 0 ? null : list[+v]; drawMontageForm(); break; }
    case "m-pick": { const s = draftM.results[+v]; draftM.extra = [s, ...draftM.extra.filter(x => x.title !== s.title)]; draftM.song = s; drawMontageForm(); break; }
    case "make-montage": makeMontage(); break;
    case "play": { const e = Store.journal.find(x => x.id === v); if (e) playMontage(e); break; }
    case "player-close": closePlayer(); break;
    case "player-next": if (player) showSlide(player.i + 1); break;
    case "player-prev": if (player) showSlide(player.i - 1); break;
    case "help": helpSheet(); break;
    case "push-on": b.textContent = "…"; try{ await Push.enable(); render(); }catch(e){ b.textContent = "Réessayer"; } break;
    case "demo-role": role = v; tab = v === "romane" ? "today" : "depot"; clearLayers(); render(); break;
    case "demo-time": demoOffset = v === "0" ? 0 : Math.max(demoOffset, Math.ceil((parseDay(CONFIG.DEPART) - Date.now()) / DAY) - 7) + 7; render(); break;
  }
});
document.addEventListener("change", async ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.act === "toggle-share"){
    const e = Store.journal.find(x => x.id === t.dataset.v); if (!e) return;
    try{
      await Store.updateEntry(e, { shared: t.checked });
      if (t.checked) Push.send("shared", e.kind === "montage" ? `${CONFIG.PRENOM} a partagé un montage` : `${CONFIG.PRENOM} a partagé une page`, e.title || e.place || "Va voir son carnet");
    }catch(x){ t.checked = !t.checked; }
    if (!layers.length) render(); else { const keep = layers.slice(); render(); keep.forEach(l => document.body.appendChild(l)); }
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape"){ if (player) closePlayer(); else if (layers.length) popLayer(); } });
