# Querida : publie le site sur GitHub Pages (à la place du publieur automatique de GitHub).
# Réglage nécessaire une fois : Settings → Pages → Source : « GitHub Actions ».
name: Publier Querida

on:
  push:
    branches: [main]
  workflow_dispatch:        # bouton « Run workflow » pour publier à la main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
          touch _site/.nojekyll
          ls -la _site | head -40
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
